<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>TiP | Not found</title>
    <link rel="icon" href="/favicon.ico" sizes="48x48">
    <link rel="icon" href="/icons/favicon-panda.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-panda.png">
    <meta name="theme-color" content="#120c09">
    <link rel="stylesheet" href="/fonts/fonts.css">
    <link rel="stylesheet" href="/css/brand.css">
    <link rel="stylesheet" href="/css/not-found.css">
    <script src="/js/brand.js" defer nonce="{{CSP_NONCE}}"></script>
</head>
<body>
<svg class="sprite" aria-hidden="true" focusable="false">
  <defs>
    <!-- Peek head, drawn in a 132 x 74 box. The bottom edge sits behind the card. -->
    <g id="head">
      <g stroke="#171719" stroke-width="1.5" stroke-linejoin="round">
        <circle cx="31" cy="23" r="16" fill="#141416"/>
        <circle cx="29" cy="21" r="15" fill="#242326"/>
        <circle cx="30" cy="22" r="8.5" fill="#494347" stroke-width="1.2"/>
        <circle cx="101" cy="23" r="16" fill="#141416"/>
        <circle cx="103" cy="21" r="15" fill="#242326"/>
        <circle cx="102" cy="22" r="8.5" fill="#494347" stroke-width="1.2"/>
      </g>
      <g stroke="#8e7b65" stroke-width="1.5" stroke-linejoin="round">
        <polygon points="24,40 38,18 66,12 94,18 108,40 112,74 20,74" fill="#f2e7d4"/>
        <g stroke-width="1.1" stroke-opacity=".65">
          <polygon points="38,18 66,12 94,18 88,32 66,29 44,32" fill="#fff6e6"/>
          <polygon points="24,40 38,18 44,32 32,52 20,74" fill="#f8eddb"/>
          <polygon points="108,40 94,18 88,32 100,52 112,74" fill="#dfd1bd"/>
        </g>
      </g>
      <g fill="#242326" stroke="#171719" stroke-width="1.4">
        <ellipse cx="49" cy="50" rx="11" ry="14" transform="rotate(22 49 50)"/>
        <ellipse cx="83" cy="50" rx="11" ry="14" transform="rotate(-22 83 50)"/>
      </g>
      <ellipse cx="66" cy="69" rx="14" ry="9" fill="#fff5e5" stroke="#d0bda4" stroke-width="1.2"/>
      <path d="M60.5 63 Q66 60 71.5 63 Q69.5 68 66 69 Q62.5 68 60.5 63 Z" fill="#171719"/>
    </g>
    <!-- Open eyes, sit inside the dark patches -->
    <g id="eyes-open">
      <ellipse cx="49" cy="50" rx="5.5" ry="7" fill="#080707"/>
      <circle cx="51.4" cy="46.8" r="2.2" fill="#fff"/>
      <ellipse cx="83" cy="50" rx="5.5" ry="7" fill="#080707"/>
      <circle cx="85.4" cy="46.8" r="2.2" fill="#fff"/>
    </g>
    <!-- Paws on the card edge, drawn in a 132 x 22 box -->
    <g id="paws">
      <g stroke="#171719" stroke-width="1.4">
        <ellipse cx="22" cy="12" rx="14" ry="9" fill="#29282b"/>
        <ellipse cx="110" cy="12" rx="14" ry="9" fill="#202023"/>
      </g>
      <path d="M16 6 v5 M22 5 v5 M28 6 v5 M104 6 v5 M110 5 v5 M116 6 v5"
            stroke="#655b5c" stroke-width="1.3" stroke-linecap="round" fill="none"/>
    </g>
  </defs>
</svg>
<header class="masthead">
  <button type="button" id="brand" class="brand" aria-expanded="false" aria-label="TiP, Tip integrated Panda">
    <span class="gold" aria-hidden="true"><span class="cap">T</span><span class="rest"><span data-text="ip"></span></span></span>
    <span class="pink" aria-hidden="true"><span class="cap">i</span><span class="rest"><span data-text="ntegrated"></span></span></span>
    <span class="cream" aria-hidden="true"><span class="cap">P</span><span class="rest"><span data-text="anda"></span></span></span>
  </button>
</header>

<main class="note-wrap lost">
  <svg class="peek" viewBox="0 0 132 74" aria-hidden="true">
    <text class="q" x="116" y="16">?</text>
    <use href="#head"/>
    <g class="eyes"><g class="pupil"><use href="#eyes-open"/></g></g>
  </svg>
  <svg class="paws" viewBox="0 0 132 22" aria-hidden="true"><use href="#paws"/></svg>
  <div class="note">
    <p class="code">404</p>
    <h1>This panda wandered off</h1>
    <p class="why">The link may be wrong, or this panda isn't set up yet. Try tapping the coin again.</p>
  </div>
</main>
</body>
</html>
