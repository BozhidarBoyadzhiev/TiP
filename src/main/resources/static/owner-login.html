<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>TiP | Owner login</title>
    <link rel="icon" href="/favicon.ico" sizes="48x48">
    <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <meta name="theme-color" content="#120c09">
    <link rel="stylesheet" href="/css/tip.css">
    <link rel="stylesheet" href="/css/owner.css">
    <script src="/js/owner-login.js" defer nonce="{{CSP_NONCE}}"></script>
</head>
<body>
<main class="card">
    <h1>Sign in</h1>
    <p id="signed-out" class="hint" role="status" hidden>You have signed out.</p>

    <form id="login-form" method="post" action="/owner/login" novalidate>
        <input type="hidden" name="{{CSRF_PARAMETER}}" value="{{CSRF_TOKEN}}">

        <div class="field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="username" required>
        </div>

        <div class="field">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>
        </div>

        <p id="login-error" class="error" role="alert" hidden></p>

        <button type="submit" class="primary">Sign in</button>
    </form>
</main>
</body>
</html>
