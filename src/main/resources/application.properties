spring.application.name=tip

server.forward-headers-strategy=framework
server.error.include-stacktrace=never
server.error.include-message=never

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.threads.virtual.enabled=true

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

tip.public-base-url=${TIP_PUBLIC_BASE_URL:}
tip.currency=${TIP_CURRENCY:GBP}
tip.min-minor=${TIP_MIN_MINOR:100}
tip.max-minor=${TIP_MAX_MINOR:10000}
tip.preset-amounts-minor=${TIP_PRESET_AMOUNTS_MINOR:100,200,500}
tip.demo-device.slug=${TIP_DEMO_DEVICE_SLUG:}
tip.demo-device.name=${TIP_DEMO_DEVICE_NAME:}

paypal.base-url=${PAYPAL_BASE_URL:https://api-m.sandbox.paypal.com}
paypal.client-id=${PAYPAL_CLIENT_ID:}
paypal.client-secret=${PAYPAL_CLIENT_SECRET:}
paypal.webhook-id=${PAYPAL_WEBHOOK_ID:}
