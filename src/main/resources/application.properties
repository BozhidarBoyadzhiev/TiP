spring.application.name=tip

# PORT is set by Render. A SERVER_PORT environment variable still wins, because it binds to server.port
# directly and environment variables take precedence over this file.
server.port=${PORT:8080}
# Tomcat's RemoteIpValve applies X-Forwarded-For and X-Forwarded-Proto only when the connection comes from
# a private address (Tomcat's default internal proxies), and takes the rightmost X-Forwarded-For entry that
# is not one, so a client cannot pick its own rate limit bucket by prepending addresses.
server.forward-headers-strategy=native
# The header the client address comes from. A single value header such as True-Client-IP counts only when it
# holds exactly one IP literal (ClientIpValve), otherwise the connection address is the client.
server.tomcat.remoteip.remote-ip-header=${TIP_CLIENT_IP_HEADER:X-Forwarded-For}
# Temporary: logs the connection address, resolved address and raw proxy headers of every /api/public request.
tip.debug-client-ip=${TIP_DEBUG_CLIENT_IP:false}
# Form posts are parsed by Tomcat; the same cap as RequestSizeLimit puts on every other body.
server.tomcat.max-http-form-post-size=64KB
server.error.include-stacktrace=never
server.error.include-message=never
server.error.whitelabel.enabled=false
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax

# Render's Basic-256mb database allows few connections, and during a deploy the old and new instance may
# run side by side.
spring.datasource.hikari.maximum-pool-size=${TIP_DB_POOL_SIZE:5}

spring.jpa.open-in-view=false
# Hibernate logs a failed statement's SQL state and PostgreSQL's detail at WARN, and the detail can carry a row's
# values (Key (...)=(...)). ProblemDetailsAdvice logs such an error by class and place instead.
logging.level.org.hibernate.orm.jdbc.error=ERROR
spring.jpa.hibernate.ddl-auto=validate
spring.threads.virtual.enabled=true

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=false

tip.public-base-url=${TIP_PUBLIC_BASE_URL:}
tip.currency=${TIP_CURRENCY:GBP}
tip.min-minor=${TIP_MIN_MINOR:100}
tip.max-minor=${TIP_MAX_MINOR:10000}
tip.preset-amounts-minor=${TIP_PRESET_AMOUNTS_MINOR:100,200,500}
tip.demo-device.slug=${TIP_DEMO_DEVICE_SLUG:}
tip.demo-device.name=${TIP_DEMO_DEVICE_NAME:}
tip.demo-device.secret=${TIP_DEMO_DEVICE_SECRET:}
tip.demo-owner.email=${TIP_DEMO_OWNER_EMAIL:}
tip.demo-owner.password=${TIP_DEMO_OWNER_PASSWORD:}
tip.demo-owner.name=${TIP_DEMO_OWNER_NAME:}

# Access codes for judge sandboxes: label:sha256hex:expiresAt entries separated by ;. Made with ./gradlew newAccessCode.
tip.access-codes=${TIP_ACCESS_CODES:}

# PayPal sandbox test card and buyer account shown to judges in their sandbox. Optional, never in the repo.
tip.judge-payment.card-number=${TIP_JUDGE_CARD_NUMBER:}
tip.judge-payment.card-expiry=${TIP_JUDGE_CARD_EXPIRY:}
tip.judge-payment.card-cvc=${TIP_JUDGE_CARD_CVC:}
tip.judge-payment.paypal-email=${TIP_JUDGE_PAYPAL_EMAIL:}
tip.judge-payment.paypal-password=${TIP_JUDGE_PAYPAL_PASSWORD:}

# Per client IP limits, sized well above honest use (docs/DEPLOYMENT.md).
tip.rate-limits.tip-orders-per-minute=${TIP_RATE_TIP_ORDERS_PER_MINUTE:10}
tip.rate-limits.captures-per-minute=${TIP_RATE_CAPTURES_PER_MINUTE:30}
tip.rate-limits.judge-sessions-per-hour=${TIP_RATE_JUDGE_SESSIONS_PER_HOUR:10}
tip.rate-limits.demo-sessions-per-minute=${TIP_RATE_DEMO_SESSIONS_PER_MINUTE:30}
tip.rate-limits.resumes-per-minute=${TIP_RATE_RESUMES_PER_MINUTE:20}
tip.rate-limits.resume-links-per-ten-minutes=${TIP_RATE_RESUME_LINKS_PER_TEN_MINUTES:5}

# Owner jobs. The crons run in Europe/London.
tip.owners.sandbox-cleanup-interval=PT1H
tip.owners.demo-reseed-cron=0 5 0 * * *
tip.owners.daily-summary-cron=0 10 0 * * *

tip.ai.enabled=${TIP_AI_ENABLED:true}
tip.ai.model=${TIP_AI_MODEL:claude-haiku-5-5}
tip.ai.api-key=${ANTHROPIC_API_KEY:}
tip.ai.base-url=${ANTHROPIC_BASE_URL:https://api.anthropic.com}
tip.ai.timeout=PT10S
tip.ai.recovery-interval=PT30S
# Classification calls the whole app makes at most, per UTC hour and day; past them tips react PLAIN once.
tip.ai.cap.per-hour=200
tip.ai.cap.per-day=1000
# A tip plays on the device only if its capture landed within this long of TiP's first capture attempt; a capture
# settled later (late webhook, PendingTipsJob, AbandonedTipsJob, a revived tip) is recorded but not played.
tip.ai.playback.window=PT10M

# Settling tips whose capture answer or webhook never came (AbandonedTipsJob, PendingTipsJob).
tip.tipping.abandon-interval=PT10M
tip.tipping.reconcile-interval=PT1H
# Deletes webhook events and unpaid tips older than 30 days (RetentionJob), in Europe/London.
tip.tipping.retention-cron=0 20 0 * * *

tip.devices.resend-interval=PT1S
tip.devices.ping-interval=PT20S
tip.devices.presence-interval=PT1S

tip.dashboard.digest-interval=PT2M
tip.dashboard.ping-interval=PT20S
tip.dashboard.today-interval=PT1S

paypal.base-url=${PAYPAL_BASE_URL:https://api-m.sandbox.paypal.com}
paypal.client-id=${PAYPAL_CLIENT_ID:}
paypal.client-secret=${PAYPAL_CLIENT_SECRET:}
paypal.webhook-id=${PAYPAL_WEBHOOK_ID:}
