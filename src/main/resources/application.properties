spring.application.name=tip

# PORT is set by Render. A SERVER_PORT environment variable still wins, because it binds to server.port
# directly and environment variables take precedence over this file.
server.port=${PORT:8080}
# Tomcat's RemoteIpValve applies X-Forwarded-For and X-Forwarded-Proto only when the connection comes from
# a private address (Tomcat's default internal proxies), and takes the rightmost X-Forwarded-For entry that
# is not one, so a client cannot pick its own rate limit bucket by prepending addresses.
server.forward-headers-strategy=native
# The header the client address comes from. A single value header such as True-Client-IP counts only when it
# holds exactly one IP literal (ClientIpValve), otherwise the connection address is the client.
server.tomcat.remoteip.remote-ip-header=${TIP_CLIENT_IP_HEADER:X-Forwarded-For}
# Temporary: logs the connection address, resolved address and raw proxy headers of every /api/public request.
tip.debug-client-ip=${TIP_DEBUG_CLIENT_IP:false}
server.error.include-stacktrace=never
server.error.include-message=never
server.error.whitelabel.enabled=false
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax

# Render's Basic-256mb database allows few connections, and during a deploy the old and new instance may
# run side by side.
spring.datasource.hikari.maximum-pool-size=${TIP_DB_POOL_SIZE:5}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.threads.virtual.enabled=true

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=false

tip.public-base-url=${TIP_PUBLIC_BASE_URL:}
tip.currency=${TIP_CURRENCY:GBP}
tip.min-minor=${TIP_MIN_MINOR:100}
tip.max-minor=${TIP_MAX_MINOR:10000}
tip.preset-amounts-minor=${TIP_PRESET_AMOUNTS_MINOR:100,200,500}
tip.demo-device.slug=${TIP_DEMO_DEVICE_SLUG:}
tip.demo-device.name=${TIP_DEMO_DEVICE_NAME:}
tip.demo-device.secret=${TIP_DEMO_DEVICE_SECRET:}
tip.demo-owner.email=${TIP_DEMO_OWNER_EMAIL:}
tip.demo-owner.password=${TIP_DEMO_OWNER_PASSWORD:}
tip.demo-owner.name=${TIP_DEMO_OWNER_NAME:}

tip.ai.enabled=${TIP_AI_ENABLED:true}
tip.ai.model=${TIP_AI_MODEL:claude-haiku-5-5}
tip.ai.api-key=${ANTHROPIC_API_KEY:}
tip.ai.base-url=${ANTHROPIC_BASE_URL:https://api.anthropic.com}
tip.ai.timeout=PT10S
tip.ai.recovery-interval=PT30S

tip.devices.resend-interval=PT1S
tip.devices.ping-interval=PT20S
tip.devices.presence-interval=PT1S

tip.dashboard.digest-interval=PT2M
tip.dashboard.ping-interval=PT20S

paypal.base-url=${PAYPAL_BASE_URL:https://api-m.sandbox.paypal.com}
paypal.client-id=${PAYPAL_CLIENT_ID:}
paypal.client-secret=${PAYPAL_CLIENT_SECRET:}
paypal.webhook-id=${PAYPAL_WEBHOOK_ID:}
