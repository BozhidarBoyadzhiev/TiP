name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

# Actions are pinned to commit SHAs, the release named beside each, so a moved tag cannot change what runs.
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Testcontainers image for the tests. The same tag is in
      # src/test/java/dev/tip/TestcontainersConfiguration.java,
      # src/test/java/dev/tip/shared/ConfigurationValidationTest.java and docker-compose.yml.
      # Change them together.
      POSTGRES_IMAGE: postgres:16-alpine
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      # Pulled up front with retries, so a registry hiccup fails fast here instead of hanging every test.
      - name: Pull PostgreSQL image
        timeout-minutes: 5
        run: |
          for attempt in 1 2 3; do
            if docker pull "$POSTGRES_IMAGE"; then
              exit 0
            fi
            echo "docker pull failed (attempt $attempt of 3)"
            if [ "$attempt" -lt 3 ]; then
              sleep 15
            fi
          done
          exit 1
      - name: Build
        run: ./gradlew build --no-daemon

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      # The SHA-256 is the one gitleaks publishes in gitleaks_8.30.1_checksums.txt; change both together.
      - name: Install gitleaks
        run: |
          curl -fsSL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan full history
        run: ./gitleaks git --redact --verbose --exit-code 1 .

  firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      # The platform and toolchain are about 1 GB; platformio.ini pins them, so it keys the cache.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.platformio
          key: platformio-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini') }}
      - name: Install PlatformIO
        run: pip install platformio==6.2.0
      # The build needs secrets.h; the committed placeholders are enough to compile.
      - name: Placeholder secrets
        run: cp include/secrets.example.h include/secrets.h
      - name: Build
        run: pio run
      - name: Native tests
        run: pio test -e native

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, secrets-scan]
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "RENDER_DEPLOY_HOOK_URL is not set, skipping deploy."
            exit 0
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"
