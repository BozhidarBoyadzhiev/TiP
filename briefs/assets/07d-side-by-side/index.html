<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TiP | Side by side</title>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="css/brand.css">
<style>
  html, body { height: 100%; }
  body { background: var(--bg-2); color: var(--cream); font-family: var(--font); overflow: hidden; }
  .stage { height: 100vh; display: grid; grid-template-columns: 0 0 1fr; gap: 0; transition: grid-template-columns .35s ease, gap .35s ease, padding .35s ease; }
  body.split .stage { grid-template-columns: 390px minmax(320px, 1fr) 460px; gap: 14px; padding: 14px; }
  .col { min-width: 0; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
  .cap { display: none; align-items: baseline; gap: 10px; padding: 2px 6px 10px; font-weight: 500; font-size: 15px; color: var(--muted); white-space: nowrap; }
  .cap b { color: var(--gold); font-weight: 700; font-size: 18px; }
  body.split .cap { display: flex; }
  .frame { flex: 1; min-height: 0; position: relative; overflow: hidden; }
  body.split .frame { border-radius: 22px; border: 1px solid var(--card-edge); background: radial-gradient(120% 90% at 50% 0%, var(--bg-1), var(--bg-2)); box-shadow: 0 18px 40px rgba(0,0,0,.35); }
  body.split .col.tip .frame { border-radius: 34px; border: 6px solid #0c0806; box-shadow: 0 0 0 1px var(--card-edge), 0 18px 40px rgba(0,0,0,.45); }
  iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: transparent; }
  .col.tip, .col.panda { visibility: hidden; }
  body.split .col.tip, body.split .col.panda { visibility: visible; }
  @media (max-width: 1099px) { body.split .stage { grid-template-columns: 0 0 1fr; gap: 0; padding: 0; } body.split .cap { display: none; } body.split .col.tip, body.split .col.panda { visibility: hidden; } }
  @media (prefers-reduced-motion: reduce) { .stage { transition: none; } }
</style>
</head>
<body>
<div class="stage">
  <section class="col tip" aria-label="Tip page">
    <div class="cap"><b>1</b>Leave a tip</div>
    <div class="frame"><iframe id="f-tip" title="Tip page"></iframe></div>
  </section>
  <section class="col panda" aria-label="Your panda">
    <div class="cap"><b>2</b>Watch the panda react</div>
    <div class="frame"><iframe id="f-panda" title="Your panda"></iframe></div>
  </section>
  <section class="col dash" aria-label="Dashboard">
    <div class="cap"><b>3</b>See it on your dashboard</div>
    <div class="frame"><iframe id="f-dash" title="Dashboard" src="owner.html"></iframe></div>
  </section>
</div>
<script>
  // PREVIEW: the real page would be /owner/live, and the switch would navigate between it and /owner.
  const tip = document.getElementById("f-tip"), panda = document.getElementById("f-panda"), dash = document.getElementById("f-dash");
  function set(on) {
    document.body.classList.toggle("split", on);
    if (on && !tip.src) { tip.src = "tip.html?embed"; panda.src = "panda.html?embed"; }
    dash.src = on ? "owner.html?embed" : "owner.html";
  }
  addEventListener("message", (e) => {
    if (!e.data) return;
    if (e.data.type === "split") set(!!e.data.on);
    if (e.data.tipPreview) [tip, panda, dash].forEach((f) => { if (f.contentWindow && f.contentWindow !== e.source) f.contentWindow.postMessage(e.data, "*"); });
  });
  // Below 1100 px there is no side by side: fall back to the plain dashboard.
  const wide = matchMedia("(min-width: 1100px)");
  wide.addEventListener("change", () => { if (!wide.matches && document.body.classList.contains("split")) set(false); });
  if (location.hash === "#split" && wide.matches) set(true);
</script>
</body>
</html>
