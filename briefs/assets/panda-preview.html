
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TiP | Tip integrated Panda</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --bg-1: #2a1e16;
  --bg-2: #120c09;
  --cream: #f3e3c8;
  --muted: #c9b08c;
  --gold: #e9bb52;
  --light: #fff4e0;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  min-height: 100%;
}

body {
  background: radial-gradient(ellipse at 50% 45%, var(--bg-1) 0%, var(--bg-2) 75%);
  color: var(--cream);
  font-family: "Fredoka", system-ui, sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 28px 16px 24px;
  overflow-x: hidden;
}

.live {
  position: fixed;
  top: 14px;
  right: 14px;
  display: flex;
  align-items: center;
  gap: 8px;
  background: rgba(0,0,0,.45);
  border-radius: 999px;
  padding: 6px 14px;
  font-weight: 500;
  font-size: 15px;
  z-index: 10;
}

.live i {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: #7bd389;
  display: block;
}

h1 {
  margin: 14px 0 0;
  line-height: 1;
  text-align: center;
}

.brand {
  font: 700 min(60px, 8.4vw) "Fredoka", system-ui, sans-serif;
  letter-spacing: .5px;
  color: var(--cream);
  background: none;
  border: 0;
  padding: 4px 8px;
  cursor: pointer;
  display: inline-flex;
  align-items: baseline;
  white-space: nowrap;
  -webkit-tap-highlight-color: transparent;
}

.brand:focus-visible {
  outline: 2px solid var(--gold);
  outline-offset: 6px;
  border-radius: 10px;
}

.brand .gold { color: var(--gold); }
.brand .pink { color: #e7a6c1; }
.brand .cream { color: var(--cream); }

.brand .cap {
  display: inline-block;
  transition: transform .45s cubic-bezier(.3, 1.7, .5, 1);
}

.brand .rest {
  display: inline-grid;
  grid-template-columns: 0fr;
  transition: grid-template-columns .5s cubic-bezier(.2, .8, .2, 1);
}

.brand .rest > span {
  overflow: hidden;
  min-width: 0;
  padding-block: .2em;
  margin-block: -.2em;
}

.brand .l {
  display: inline-block;
  opacity: 0;
  transform: translateY(.45em) rotate(-10deg) scale(.8);
  transition: opacity .2s ease, transform .4s cubic-bezier(.3, 1.6, .5, 1);
  transition-delay: calc(var(--d) * 28ms);
}

.brand:hover .rest,
.brand:focus-visible .rest,
.brand[aria-expanded="true"] .rest {
  grid-template-columns: 1fr;
}

.brand:hover .l,
.brand:focus-visible .l,
.brand[aria-expanded="true"] .l {
  opacity: 1;
  transform: none;
}

.brand:hover .cap,
.brand:focus-visible .cap,
.brand[aria-expanded="true"] .cap {
  transform: translateY(-.06em) scale(1.06);
}

.brand .sp {
  display: inline-block;
  width: .28em;
}

.stage {
  width: min(420px, 92vw);
  margin-top: 10px;
}

svg {
  width: 100%;
  height: auto;
  display: block;
  overflow: visible;
}

.caption {
  margin-top: 6px;
  color: var(--muted);
  text-align: center;
  font-size: 17px;
  max-width: 460px;
  line-height: 1.45;
}

.demo {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  justify-content: center;
  margin-top: 18px;
}

.demo button {
  font: 500 14px "Fredoka", sans-serif;
  color: var(--cream);
  background: rgba(255,255,255,.08);
  border: 1px solid rgba(255,255,255,.15);
  border-radius: 999px;
  padding: 7px 14px;
  cursor: pointer;
}

.demo button:hover {
  background: rgba(255,255,255,.16);
}

.demo button:focus-visible {
  outline: 2px solid var(--gold);
  outline-offset: 3px;
}

#panda-coin-glow { stroke: var(--light); }
#panda-coin-light { fill: var(--light); mix-blend-mode: screen; }

.upper {
  animation: breathe 4.2s ease-in-out infinite;
  transform-origin: 200px 430px;
}

.eye {
  animation: blink 5.5s infinite;
  transform-box: fill-box;
  transform-origin: center;
}

.head {
  animation: tilt 7s ease-in-out infinite;
  transform-origin: 200px 255px;
}

.sheen {
  animation: sheen 6s ease-in-out infinite;
}

@keyframes breathe {
  0%,100% { transform: scale(1, 1) }
  50% { transform: scale(1.012, .988) }
}

@keyframes blink {
  0%, 93%, 100% { transform: scaleY(1) }
  95% { transform: scaleY(.08) }
  97% { transform: scaleY(1) }
}

@keyframes tilt {
  0%,100% { transform: rotate(0deg) }
  30% { transform: rotate(-2.2deg) }
  60% { transform: rotate(1.4deg) }
}

@keyframes sheen {
  0%, 70% { transform: translateX(0) }
  100% { transform: translateX(200px) }
}

@media (prefers-reduced-motion: reduce) {
  .upper, .eye, .head, .sheen { animation: none; }
  .brand .rest, .brand .l, .brand .cap { transition: none; }
}
</style>
</head>

<body>
<div class="live"><i></i>Live</div>

<h1>
  <button type="button" class="brand"
          aria-expanded="false"
          aria-label="TiP, Tip integrated Panda">
    <span class="gold" aria-hidden="true">
      <span class="cap">T</span>
      <span class="rest"><span data-text="ip"></span></span>
    </span>
    <span class="pink" aria-hidden="true">
      <span class="cap">i</span>
      <span class="rest"><span data-text="ntegrated"></span></span>
    </span>
    <span class="cream" aria-hidden="true">
      <span class="cap">P</span>
      <span class="rest"><span data-text="anda"></span></span>
    </span>

<p class="caption">

</p>

<div class="demo">
  <button type="button" data-k="WARM">Warm</button>
  <button type="button" data-k="PLAYFUL">Playful</button>
  <button type="button" data-k="REQUEST">Request</button>
  <button type="button" data-k="PLAIN">Plain</button>
</div>

<script>
const brand = document.querySelector('.brand');

brand.querySelectorAll('[data-text]').forEach((el, w, all) => {
  [...el.dataset.text].forEach((ch, i) => {
    const letter = document.createElement('span');
    letter.className = 'l';
    letter.textContent = ch;
    letter.style.setProperty('--d', i);
    el.appendChild(letter);
  });

  if (w < all.length - 1) {
    const space = document.createElement('span');
    space.className = 'sp';
    el.appendChild(space);
  }
});

brand.addEventListener('click', () => {
  const expanded = brand.getAttribute('aria-expanded') === 'true';
  brand.setAttribute('aria-expanded', String(!expanded));
});

const colours = {
  WARM: '#ff7fb0',
  PLAYFUL: '#ffd54a',
  REQUEST: '#6fb6ff',
  PLAIN: '#fff4e0'
};

const frames = {
  WARM: [0, 1, .2, .9, 0, 0],
  PLAYFUL: [0, 1, 0, .8, 0, 1, 0, .7, 0],
  REQUEST: [0, 1, 1, 0],
  PLAIN: [0, 1, 0]
};

const glow = document.getElementById('panda-coin-glow');
const tint = document.getElementById('panda-coin-light');
const sparkle = document.getElementById('panda-coin-sparkle');

document.querySelectorAll('.demo button').forEach(button => {
  button.addEventListener('click', () => {
    const key = button.dataset.k;

    document.documentElement.style.setProperty('--light', colours[key]);

    const duration = key === 'REQUEST' ? 1800 : 1200;

    [glow, tint, sparkle].forEach(el => {
      el.getAnimations().forEach(animation => animation.cancel());
    });

    const animateOpacity = (element, scale) => {
      element.animate(
        frames[key].map(opacity => ({
          opacity: opacity * scale
        })),
        {
          duration,
          easing: 'ease-in-out',
          fill: 'none'
        }
      );
    };

    animateOpacity(glow, 1);
    animateOpacity(tint, .35);
    animateOpacity(sparkle, 1);
  });
});
</script>

</html>
