services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tip
      POSTGRES_USER: tip
      POSTGRES_PASSWORD: tip
    ports:
      - "5432:5432"
    volumes:
      - tip-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tip -d tip"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  tip-postgres:
