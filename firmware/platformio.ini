; TiP panda firmware. Arduino core 3.3.12 through the pioarduino platform,
; pinned to an exact release so every build uses the same toolchain.
[env:esp32dev]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder
build_flags = -DCORE_DEBUG_LEVEL=1
