; TiP panda firmware. Arduino core 3.3.12 through the pioarduino platform,
; pinned to an exact release so every build uses the same toolchain.
[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32dev
framework = arduino
board_build.partitions = huge_app.csv
monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder
; WEBSOCKETS_NETWORK_TYPE 10 is the library's NETWORK_CUSTOM: src/secure_transport.cpp supplies
; the TLS client, so certificate checks stay in our code.
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DWEBSOCKETS_NETWORK_TYPE=10
lib_deps =
    ; 2.7.2 and 2.7.3 call setCertificate and setPrivateKey on the custom TLS client, which their
    ; own WebSocketsNetworkClientSecure does not declare, so NETWORK_CUSTOM does not compile.
    links2004/WebSockets@2.7.1
    bblanchon/ArduinoJson@6.21.5

; Host build of lib/tip_core for the Unity tests: pio test -e native
[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17 -Wall -Wextra
extra_scripts = scripts/static_link.py
lib_deps =
    bblanchon/ArduinoJson@6.21.5
