; Brief 05c spike: PN532 over HSU (UART2, GPIO16 RX / GPIO17 TX) on the panda ESP32.
; Standalone project, not part of the main firmware build. Same platform and Arduino core
; (pioarduino, core 3.3.12) as firmware/platformio.ini. See README.md in this folder.
[platformio]
default_envs = emulate

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DNFC_INTERFACE_HSU
lib_deps =
    ; Seeed-Studio/PN532 v1.1.0 (BSD-3-Clause), pinned to the tag's commit.
    https://github.com/Seeed-Studio/PN532.git#e44820e4ecbffbae00419b404b655fd269582741
    ; Declared by PN532's library.json without a version; pinned here so the build is repeatable.
    ; The spike does not include it (src/ndef.cpp builds the record).
    NDEF=https://github.com/don/NDEF.git#838d3b68a62c5b95158b4ab4bdeabb3a5225001f

; Link test, then emulate an NFC Forum Type 4 tag holding the tip URL, with a heartbeat in loop().
[env:emulate]
build_flags =
    ${env.build_flags}
    -DSPIKE_MODE_EMULATE

; Link test, then write the same NDEF URI to an NTAG215 sticker in reader mode (the fallback).
[env:write_tag]
build_flags =
    ${env.build_flags}
    -DSPIKE_MODE_WRITE_TAG
